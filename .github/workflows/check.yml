name: Check RadioDesk
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: radiodesk-standalone
          path: dist/radiodesk.html
          if-no-files-found: error
