name: Check RadioDesk
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Hamlib for Dummy backend integration
        run: sudo apt-get update && sudo apt-get install -y libhamlib-utils
      - run: npm ci
      - run: npm run check
        env:
          RADIODESK_HAMLIB_TEST_BINARY: rigctld
      - uses: actions/upload-artifact@v4
        with:
          name: radiodesk-standalone
          path: dist/radiodesk.html
          if-no-files-found: error
      - name: Prepare live app
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p pages
          cp dist/radiodesk.html pages/index.html
          touch pages/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: pages
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy live app
        id: deployment
        uses: actions/deploy-pages@v4
